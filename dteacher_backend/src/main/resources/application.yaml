spring:
  application:
    name: dteacher_backend
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5437/dteacher_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    root: INFO
    com.dias.dteacher: DEBUG
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    com.zaxxer.hikari: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

jwt:
  secret: ${JWT_SECRET:bXVkZS1zZWNyZXQta2V5LXRoYXQtaXMtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy0x}
  expiration-ms: 86400000

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11435}
  model: ${OLLAMA_MODEL:llama3.2}
