services:
  postgres:
    image: postgres:17-alpine
    container_name: dteacher_container
    environment:
      POSTGRES_DB: dteacher_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - dteacher_pgdata:/var/lib/postgresql/data

  ollama:
    image: alpine/ollama
    container_name: ollama_container
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  ollama-pull:
    image: curlimages/curl:latest
    container_name: ollama_pull_container
    depends_on:
      ollama:
        condition: service_healthy
    command: ["-s", "-X", "POST", "http://ollama:11434/api/pull", "-H", "Content-Type: application/json", "-d", "{\"name\":\"llama3.2\"}", "--max-time", "600"]
    restart: "no"

volumes:
  dteacher_pgdata:
  ollama_data:
