services:
  postgres:
    image: postgres:17-alpine
    container_name: dteacher_container
    environment:
      POSTGRES_DB: dteacher_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5437:5432"
    volumes:
      - dteacher_pgdata:/var/lib/postgresql/data

volumes:
  dteacher_pgdata:
