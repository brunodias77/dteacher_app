<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>

  <app-input
    id="reg-name"
    formControlName="name"
    label="Nome"
    hint="(opcional)"
    placeholder="Seu nome"
    autocomplete="name"
    [error]="nameError()"
  />

  <app-input
    id="reg-email"
    formControlName="email"
    label="E-mail"
    type="email"
    placeholder="seu@email.com"
    autocomplete="email"
    [error]="emailError()"
  />

  <app-input
    id="reg-password"
    formControlName="password"
    label="Senha"
    type="password"
    placeholder="Mínimo 8 caracteres e 1 número"
    autocomplete="new-password"
    showPasswordToggle
    [error]="passwordError()"
  />

  <app-input
    id="reg-password-confirm"
    formControlName="passwordConfirmation"
    label="Confirmar senha"
    type="password"
    placeholder="Repita a senha"
    autocomplete="new-password"
    showPasswordToggle
    [error]="passwordConfirmError()"
  />

  <!-- API errors -->
  @if (apiErrors().length > 0) {
    <div class="border border-[rgba(248,113,113,0.3)] bg-[rgba(248,113,113,0.05)] px-4 py-3 space-y-1">
      @for (err of apiErrors(); track err) {
        <p class="text-[13px] text-danger">{{ err }}</p>
      }
    </div>
  }

  <app-button type="submit" [loading]="loading()" block class="mt-2">
    {{ loading() ? 'Criando conta…' : 'Criar conta' }}
  </app-button>

</form>

<!-- Login link -->
<p class="text-center text-[13px] text-text-mid mt-6">
  Já tem conta?
  <a routerLink="/login" class="text-accent hover:brightness-110 transition-[filter] ml-1">
    Entrar
  </a>
</p>
